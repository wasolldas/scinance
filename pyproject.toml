[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bybit-edge"
version = "0.1.0"
description = "Bybit V5 algorithmic trading system with 26 quantitative methods"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "duckdb>=0.10",
    "polars>=0.20",
    "numpy>=1.26",
    "numba>=0.59",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "sortedcontainers>=2.4",
    "pykalman>=0.9",
    "filterpy>=1.4",
    "hmmlearn>=0.3",
    "PyWavelets>=1.5",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.3",
    "torchvision>=0.18",
    "torchaudio>=2.3",
    "snntorch>=0.9",
    "PyWavelets>=1.5",
]
foundation = [
    "momentfm",
    "transformers>=4.40",
    "peft>=0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
dashboard = [
    "streamlit>=1.31",
    "plotly>=5.18",
    "streamlit-autorefresh>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
