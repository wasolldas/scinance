name: bybit-edge
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio
  - nvidia::pytorch-cuda=12.4
  - conda-forge::duckdb
  - conda-forge::polars
  - conda-forge::numba
  - pip
  - pip:
    - -e ".[dev,gpu]"
